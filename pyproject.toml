[project]
name = "qpe-lab"
version = "0.1.0"
description = "Python circuit generators and independently checked DFTHC microkernels"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "uncompute",
    "pygridsynth==2.0.0",
    "pyzx==0.10.7",
]

[project.scripts]
qpe-lab = "qpe_lab.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
uncompute = { path = "third_party/uncompute", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

